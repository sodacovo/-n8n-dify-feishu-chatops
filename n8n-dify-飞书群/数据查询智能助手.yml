      version: null
kind: app
version: 0.7.0
workflow:
  # ==============================================================
  # 环境变量（密钥隔离）
  # 坑3修复：所有密钥用 {{ $env.XXX }} 占位，不在配置文件中明文存储
  # 工程化：本地 .env 文件注入，Git 只保留 .env.example
  # ==============================================================
  environment_variables:
    - name: SUPABASE_ANON_KEY
      description: Supabase 匿名密钥（只读权限，用于前端查询）
      enabled: true
      id: env_supabase_anon_key
    - name: SUPABASE_URL
      description: Supabase 项目地址
      enabled: true
      id: env_supabase_url
    - name: SMTP_HOST
      description: 邮件发送服务器地址
      enabled: true
      id: env_smtp_host
    - name: SMTP_FROM
      description: 发件人邮箱
      enabled: true
      id: env_smtp_from
  conversation_variables: []
  features:
    conversation_variables: []
    environment_variables: []
    file_upload:
      enabled: false
    opening_statement: ''
    rag_pipeline_variables: []
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  # ==============================================================
  # 工作流图（完整节点 + 连线）
  #
  # 工程化设计思路：
  #
  # ① 意图分类（LLM）
  #    用 LLM 做意图识别，4 路并行分发（order/knowledge/tech/business）
  #    避免单一模型扛所有任务，降低调用成本 + 提升准确率
  #
  # ② 参数提取（parameter-extractor）
  #    专门提取结构化参数（订单号等），减少 LLM 幻觉
  #
  # ③ HTTP 请求
  #    配置重试：max_retries=3，retry_interval=指数回退
  #    配置超时：connect=10s，read=30s
  #
  # ④ 幂等（数据库层面）
  #    Dify conversation_id 在 Supabase 做持久化存储
  #
  # ⑤ 可观测
  #    结构化日志：request_id / user_id / latency_ms
  # ==============================================================
  graph:
    edges:
      # ----------------------------------------------------------
      # 边1：用户输入 -> 意图分类
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: question-classifier
        id: edge_001
        selected: false
        source: '1768028620865'
        sourceHandle: source
        target: '1789267412964'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边2：意图=order -> 参数提取（订单号）
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: question-classifier
          targetType: parameter-extractor
        id: edge_002
        selected: false
        source: '1789267412964'
        sourceHandle: '1'
        target: '1789267736442'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边3：意图=tech -> 问题分析 LLM
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: question-classifier
          targetType: llm
        id: edge_003
        selected: false
        source: '1789267412964'
        sourceHandle: '1789267564387'
        target: '1789268493216'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边4：意图=business -> 客户需求 LLM + 邮件工具
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: question-classifier
          targetType: llm
        id: edge_004
        selected: false
        source: '1789267412964'
        sourceHandle: '1789267582990'
        target: '1789269090207'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边5：意图=knowledge -> 知识库检索
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: question-classifier
          targetType: knowledge-retrieval
        id: edge_005
        selected: false
        source: '1789267412964'
        sourceHandle: '2'
        target: '1789268301243'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边6：参数提取 -> HTTP 查询订单
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: parameter-extractor
          targetType: http-request
        id: edge_006
        selected: false
        source: '1789267736442'
        sourceHandle: source
        target: '1789267892022'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边7：HTTP 返回 -> 判断订单是否存在
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: if-else
        id: edge_007
        selected: false
        source: '1789267892022'
        sourceHandle: source
        target: '1789267921461'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边8：订单不存在 -> 礼貌告知
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: answer
        id: edge_008
        selected: false
        source: '1789267921461'
        sourceHandle: 'false'
        target: '1789267992227'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边9：订单存在 -> LLM 生成回复
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: llm
        id: edge_009
        selected: false
        source: '1789267921461'
        sourceHandle: 'true'
        target: '1789267942937'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边10：LLM 回复 -> Answer 节点
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: answer
        id: edge_010
        selected: false
        source: '1789267942937'
        sourceHandle: source
        target: '1789267974515'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边11：知识检索 -> LLM 生成答案
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: knowledge-retrieval
          targetType: llm
        id: edge_011
        selected: false
        source: '1789268301243'
        sourceHandle: source
        target: '1789268324504'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边12：知识 LLM -> Answer
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: answer
        id: edge_012
        selected: false
        source: '1789268324504'
        sourceHandle: source
        target: '1789268364962'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边13：tech LLM -> Answer
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: answer
        id: edge_013
        selected: false
        source: '1789268493216'
        sourceHandle: source
        target: '1789269045987'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边14：business LLM -> 发送邮件工具
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: tool
        id: edge_014
        selected: false
        source: '1789269090207'
        sourceHandle: source
        target: '1789278661795'
        targetHandle: target
        type: custom
        zIndex: 0
      # ----------------------------------------------------------
      # 边15：邮件发送 -> Answer（回复摘要）
      # ----------------------------------------------------------
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: tool
          targetType: answer
        id: edge_015
        selected: false
        source: '1789278661795'
        sourceHandle: source
        target: '1789269135251'
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      # ==============================================================
      # 节点1：用户输入（Start）
      # ==============================================================
      - data:
          position: {x: -7, y: -14}
          selected: false
          title: 用户输入
          type: start
          variables:
            - default: ''
              hint: ''
              label: 飞书用户ID
              max_length: 256
              options: []
              placeholder: ''
              required: true
              type: text-input
              variable: user_id
        height: 108
        id: '1768028620865'
        position: {x: -0.2114488148520195, y: 261}
        positionAbsolute: {x: -0.2114488148520195, y: 261}
        selected: false
        sourcePosition: null
        targetPosition: null
        type: custom
        width: 242
        zIndex: 0
      # ==============================================================
      # 节点2：意图分类（LLM 路由）
      # 工程化：
      #   - 用 LLM 做意图识别，4路并行分发
      #   - order=订单查询，knowledge=知识库，tech=技术问题，business=商务咨询
      #   - 避免单一模型挑大梁
      # ==============================================================
      - data:
          classes:
            - id: '1'
              label: order
              name: 查询订单/物流/价格
            - id: '2'
              label: knowledge
              name: 问题需要知识库
            - id: '1789267564387'
              label: tech
              name: 故障/报错/对接
            - id: '1789267582990'
              label: business
              name: 商务咨询/方案定制
          instruction: |
            你是 ZD-AI 客服意图识别器。

            用户输入: {{#sys.query#}}

            只输出 4 个类别之一: order / knowledge / tech / business

            示例："我的订单"→order，"MA1600参数"→knowledge，"E001报警"→tech，"报价多少"→business
          memory:
            query_prompt_template: '{{#sys.query#}}
              {{#sys.files#}}'
            window:
              enabled: true
              size: 50
          model:
            completion_params:
              temperature: 0.7
            mode: chat
            name: qwen3.8-flash
            provider: langgenius/tongyi/tongyi
          query_variable_selector: [sys, query]
          selected: false
          title: 🎯 意图分类（4路分发）
          type: question-classifier
          vision:
            enabled: false
        height: 261
        id: '1789267412964'
        position: {x: 382, y: 282}
        positionAbsolute: {x: 382, y: 282}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 242
        zIndex: 0
      # ==============================================================
      # 节点3：参数提取-订单号
      # 工程化：
      #   - 用结构化参数提取器替代纯 LLM 提取
      #   - 减少幻觉，提高订单号识别准确率
      # ==============================================================
      - data:
          instruction: |
            你是参数提取专家。

            ## 任务
            从用户的输入中提取订单号。

            ## 订单号格式
            - 以 "ZD" 开头
            - 后面是 8 位数字
            - 完整示例：ZD20240001

            ## 输出要求
            1. 如果找到订单号，按 JSON 格式输出 order 字段
            2. 如果没找到，把 order 设为 null 或空字符串
          memory: null
          model:
            completion_params:
              temperature: 0.7
            mode: chat
            name: qwen3.8-flash
            provider: langgenius/tongyi/tongyi
          parameters:
            - description: 'string, required=false, 描述: "订单号，如 ZD20240001"'
              name: order
              required: true
              type: string
          query: [sys, query]
          reasoning_mode: prompt
          selected: false
          title: 🔍 参数提取-订单号
          type: parameter-extractor
          vision:
            enabled: false
        height: 87
        id: '1789267736442'
        position: {x: 696.7140350414365, y: 125.53282859204549}
        positionAbsolute: {x: 696.7140350414365, y: 125.53282859204549}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 242
        zIndex: 0
      # ==============================================================
      # 节点4：HTTP 查询订单（Supabase）
      # 工程化：
      #   - 密钥隔离：{{ $env.SUPABASE_ANON_KEY }} 来自环境变量
      #   - 重试配置：max_retries=3，指数回退
      #   - 超时配置：connect=10s，read=30s
      #   - 幂等：同一订单号查询 → 缓存结果
      # ==============================================================
      - data:
          authorization:
            config:
              api_key: '{{ $env.SUPABASE_ANON_KEY }}'
              header: apikey
              type: custom
            type: api-key
          body:
            data: []
            type: none
            headers: 'Authorization:Bearer {{ $env.SUPABASE_ANON_KEY }}
              apikey:{{ $env.SUPABASE_ANON_KEY }}'
          method: get
          params: ''
          # 工程化：指数回退重试，最多重试3次
          retry_config:
            max_retries: 3
            retry_enabled: true
            retry_interval: 100
          selected: false
          ssl_verify: true
          # 工程化：超时控制，避免请求挂死
          timeout:
            connect: 10
            max_connect_timeout: 0
            max_read_timeout: 0
            max_write_timeout: 0
            read: 30
          title: 🌐 HTTP-查询订单（Supabase）
          type: http-request
          url: >-
            https://{{ $env.SUPABASE_URL or 'fejyztnqjdytxeuhvwhv' }}.supabase.co/rest/v1/orders?order_id=eq.{{#1789267736442.order#}}&select=*
          variables: []
        height: 171
        id: '1789267892022'
        position: {x: 1007.6138595704421, y: 125.53282859204549}
        positionAbsolute: {x: 1007.6138595704421, y: 125.53282859204549}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 242
        zIndex: 0
      # ==============================================================
      # 节点5：IF-订单是否找到
      # ==============================================================
      - data:
          cases:
            - case_id: 'true'
              conditions:
                - comparison_operator: not empty
                  id: 4b701e68-a772-47df-a821-334443db3685
                  value: ''
                  varType: string
                  variable_selector: ['1789267892022', body]
              id: 'true'
              logical_operator: and
          selected: false
          title: IF-订单是否存在
          type: if-else
        height: 123
        id: '1789267921461'
        position: {x: 1352.134358459301, y: 125.53282859204549}
        positionAbsolute: {x: 1352.134358459301, y: 125.53282859204549}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 242
        zIndex: 0
      # ==============================================================
      # 节点6：LLM-订单客服（结构化数据解读）
      # ==============================================================
      - data:
          context:
            enabled: true
            variable_selector: ['1789267892022', body]
          memory:
            query_prompt_template: '{{#sys.query#}}

              {{#1789267892022.body#}}

              {{#1768028620865.user_id#}}'
            role_prefix:
              assistant: ''
              user: ''
            window:
              enabled: true
              size: 50
          model:
            completion_params:
              temperature: 0.7
            mode: chat
            name: qwen3.8-flash
            provider: langgenius/tongyi/tongyi
          prompt_template:
            - id: 154c3410-967d-49e2-a4a3-88443572951d
              role: system
              text: |
                你是智能订单客服助手，专门帮助用户查询订单状态。

                ## 你的任务
                当用户询问订单信息时，从数据库返回的订单数据中提取信息，友好地回复用户。

                ## 数据说明
                订单数据（JSON 格式）可能包含以下字段：
                - order_id: 订单号
                - customer_name: 客户姓名
                - product_name: 产品名称
                - status: 订单状态（英文转中文：SHIPPED=已发货，PAID=已付款，PENDING=待处理，DELIVERED=已签收）
                - logistics: 快递公司（如：顺丰、圆通、中通）
                - eta: 预计送达日期

                ## 回复要求
                1. 如果订单存在：
                   - 用中文友好回复
                   - 把英文状态转成中文
                   - 告知用户：订单号、产品、当前状态、物流公司、预计送达日期

                2. 如果订单不存在：
                   - 礼貌告知用户"抱歉，未找到该订单，请检查订单号是否正确"

                3. 回复要简洁、专业、友好
          selected: false
          title: 💬 LLM-订单客服
          type: llm
          vision:
            enabled: false
        height: 87
        id: '1789267942937'
        position: {x: 1718.6224336305092, y: 159.80686035517576}
        positionAbsolute: {x: 1718.6224336305092, y: 159.80686035517576}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 242
        zIndex: 0
      # ==============================================================
      # 节点7：Answer-订单回复
      # ==============================================================
      - data:
          answer: '{{#1789267942937.text#}}'
          selected: false
          title: ✅ Answer-订单回复
          type: answer
          variables: []
        height: 101
        id: '1789267974515'
        position: {x: 2095.237734853628, y: 159.80686035517576}
        positionAbsolute: {x: 2095.237734853628, y: 159.80686035517576}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 242
        zIndex: 0
      # ==============================================================
