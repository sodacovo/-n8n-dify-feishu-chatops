      # ==============================================================
      - data:
          answer: >-
            抱歉，未找到订单号 **{{#1789267736442.order#}}**，请检查订单号是否正确。

            订单号格式为 ZD 开头 + 8 位数字，如 ZD20240001。
        selected: false
          title: ❌ Answer-订单未找到
          type: answer
          variables: []
        height: 133
        id: '1789267992227'
        position: {x: 1711.1609035081974, y: 328.7106585584687}
        positionAbsolute: {x: 1711.1609035081974, y: 328.7106585584687}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 242
        zIndex: 0
      # ==============================================================
      # 节点9：知识库检索
      # 工程化：支持 Rerank 重排序，top_k=4 召回更精准
      # ==============================================================
      - data:
          dataset_ids:
            - >-
              {{ $env.DIFY_KNOWLEDGE_DATASET_ID || 'qxcL9snI73CH1ul1jw8J7CqUoI15qWEWVHbqLRaBoilr5M5vXEq7kPyQ/xc6pA8z' }}
          multiple_retrieval_config:
            reranking_enable: true
            reranking_mode: reranking_model
            reranking_model:
              model: qwen3-rerank
              provider: langgenius/tongyi/tongyi
            top_k: 4
          query_attachment_selector: []
          query_variable_selector: [sys, query]
          retrieval_mode: multiple
          selected: false
          title: 📚 知识检索（TopK=4+Rerank）
          type: knowledge-retrieval
        height: 89
        id: '1789268301243'
        position: {x: 696.7140350414365, y: 387.65754393370145}
        positionAbsolute: {x: 696.7140350414365, y: 387.65754393370145}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 242
        zIndex: 0
      # ==============================================================
      # 节点10：LLM-基于知识检索
      # ==============================================================
      - data:
          context:
            enabled: true
            variable_selector: ['1789268301243', result]
          memory:
            query_prompt_template: '{{#sys.query#}}

              {{#1789268301243.result#}}

              {{#1768028620865.user_id#}}'
            role_prefix:
              assistant: ''
              user: ''
            window:
              enabled: true
              size: 50
          model:
            completion_params:
              temperature: 0.7
            mode: chat
            name: qwen3.8-flash
            provider: langgenius/tongyi/tongyi
          prompt_template:
            - id: eb937bec-0d16-491f-b3c4-7bca1307e64e
              role: system
              text: |
                你是智能产品知识库助手，专注于回答用户关于注塑机产品的问题。

                ## 你的数据来源
                用户的问题会附上从知识库检索到的相关文档片段（context 字段）。

                ## 你的任务
                1. 仔细阅读检索到的文档内容
                2. 基于文档内容，准确回答用户问题
                3. 如果文档中有相关信息：
                   - 直接引用/总结文档内容回答
                   - 回答要专业、清晰、简洁
                4. 如果文档中没有相关信息：
                   - 礼貌告知用户"抱歉，知识库中没有找到相关内容"
                   - 建议用户咨询人工客服
                5. 只基于检索到的文档回答，不要编造信息

                ## 回答风格
                - 专业技术问题 → 准确、详细
                - 常见问题 → 简洁、易懂
